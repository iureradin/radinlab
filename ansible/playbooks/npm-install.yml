---
- name: Instalar Nginx Proxy Manager
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Atualizar pacotes
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Instalar dependências básicas
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - python3
        state: present

    - name: Verificar se NPM já está instalado
      ansible.builtin.stat:
        path: /opt/nginx-proxy-manager/backend/package.json
      register: npm_installed

    - name: Instalar NPM via npm-native
      when: not npm_installed.stat.exists
      block:
        - name: Baixar installer
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/njordium/npm-native/main/npm-installer.sh
            dest: /tmp/npm-installer.sh
            mode: "0755"

        - name: Executar instalação
          ansible.builtin.shell: |
            set -o pipefail
            NPM_AUTOSWAP=true bash /tmp/npm-installer.sh --fresh --quiet
          args:
            executable: /bin/bash
          register: npm_install
          changed_when: npm_install.rc == 0
          timeout: 900

        - name: Limpar installer
          ansible.builtin.file:
            path: /tmp/npm-installer.sh
            state: absent

    - name: Atualizar NPM existente
      when: npm_installed.stat.exists
      block:
        - name: Baixar installer para update
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/njordium/npm-native/main/npm-installer.sh
            dest: /tmp/npm-installer.sh
            mode: "0755"

        - name: Executar atualização
          ansible.builtin.shell: |
            set -o pipefail
            bash /tmp/npm-installer.sh --update --quiet
          args:
            executable: /bin/bash
          register: npm_update
          changed_when: npm_update.rc == 0
          timeout: 900

        - name: Limpar installer
          ansible.builtin.file:
            path: /tmp/npm-installer.sh
            state: absent

    - name: Garantir que NPM está rodando
      ansible.builtin.systemd:
        name: nginx-proxy-manager
        state: started
        enabled: true
