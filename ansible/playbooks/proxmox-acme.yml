---
- name: Configurar ACME
  hosts: all
  any_errors_fatal: true
  vars:
    acme_email: "{{ lookup('env', 'ACME_EMAIL') }}"
    acme_domain: "{{ lookup('env', 'PROXMOX_HOST') }}"
    aws_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    aws_secret: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
  tasks:
    - name: Registrar conta ACME no Let's Encrypt
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f /etc/pve/priv/acme/default ]; then
          echo "skip"
          exit 0
        fi
        yes | pvenode acme account register default {{ acme_email }} \
          --directory https://acme-v02.api.letsencrypt.org/directory
      args:
        executable: /bin/bash
      register: acme_register
      changed_when: "'skip' not in acme_register.stdout"

    - name: Verificar se plugin route53 já existe
      ansible.builtin.command: pvenode acme plugin list --output-format json
      register: acme_plugins
      changed_when: false

    - name: Configurar plugin DNS Route53
      ansible.builtin.shell: |
        set -o pipefail
        cat > /tmp/route53-creds.ini <<EOF
        AWS_ACCESS_KEY_ID={{ aws_key }}
        AWS_SECRET_ACCESS_KEY={{ aws_secret }}
        EOF
        pvenode acme plugin add dns route53 --api aws --data /tmp/route53-creds.ini
        rm -f /tmp/route53-creds.ini
      args:
        executable: /bin/bash
      when: "'route53' not in acme_plugins.stdout"
      changed_when: true

    - name: Configurar domínio ACME no node
      ansible.builtin.command: >
        pvenode config set
        --acmedomain0 domain={{ acme_domain }},plugin=route53
      changed_when: true

    - name: Verificar se certificado válido já existe
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f /etc/pve/local/pveproxy-ssl.pem ]; then
          EXPIRY=$(openssl x509 -in /etc/pve/local/pveproxy-ssl.pem -noout -enddate 2>/dev/null | cut -d= -f2)
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          if [ "$DAYS_LEFT" -gt 30 ]; then
            echo "skip"
            exit 0
          fi
        fi
        echo "renew"
      args:
        executable: /bin/bash
      register: cert_check
      changed_when: false

    - name: Solicitar certificado via ACME
      ansible.builtin.command: pvenode acme cert order --force
      register: acme_order
      retries: 3
      delay: 30
      until: acme_order.rc == 0
      changed_when: acme_order.rc == 0
      when: "'renew' in cert_check.stdout"
