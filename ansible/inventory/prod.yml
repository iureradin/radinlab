---
# Inventory de produção — RadinLab
# ATENÇÃO: Cada playbook deve especificar explicitamente o grupo alvo.
# Nunca use hosts: all — sempre especifique 'proxmox' ou 'immich'.

proxmox:
  hosts:
    naruto:
      ansible_host: "{{ ansible_host_proxmox | default('10.0.0.70') }}"
      ansible_user: root

immich:
  hosts:
    immich_ct:
      ansible_host: "{{ ansible_host_immich | default('10.0.0.76') }}"
      ansible_user: root
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
