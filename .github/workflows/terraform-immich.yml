# ---
# Terraform Immich - Provision LXC Container
# Follows radinlab conventions: self-hosted runner, branches prod/dev
# ---

name: Terraform Immich

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destruir o CT 110? (digite "yes" para confirmar)'
        required: false
        default: 'no'
  push:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'
  pull_request:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "terraform/immich"

jobs:
  # --- Destroy (somente quando inputs.destroy == 'yes')
  destroy:
    name: Terraform Destroy
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event.inputs.destroy == 'yes'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Validate and Plan
  plan:
    name: Terraform Plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    if: github.event.inputs.destroy != 'yes'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Apply (only on push to prod/dev, not PRs)
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Post-provision: Configura LXC + Docker + Immich via Ansible
  provision:
    name: Provision Immich
    needs: apply
    runs-on: [self-hosted, prod]
    timeout-minutes: 20
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          if ! command -v ansible-playbook &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ansible
          fi
          ansible --version

      - name: Run immich-provision playbook
        env:
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          IMMICH_VERSION: "v3"
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook \
            -i ansible/inventory/prod.yml \
            ansible/playbooks/immich-provision.yml \
            -e proxmox_host=${{ vars.PROXMOX_HOST }} \
            -e immich_host=${{ vars.IMMICH_HOST }} \
            -e immich_db_password="${{ secrets.IMMICH_DB_PASSWORD }}"
