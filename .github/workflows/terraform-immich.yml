# ---
# Terraform Immich - Provision LXC Container
# Follows radinlab conventions: self-hosted runner, branches prod/dev
# ---

name: Terraform Immich

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destruir o CT 110? (digite "yes" para confirmar)'
        required: false
        default: 'no'
  push:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'
  pull_request:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "terraform/immich"

jobs:
  # --- Destroy (somente quando inputs.destroy == 'yes')
  destroy:
    name: Terraform Destroy
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event.inputs.destroy == 'yes'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Validate and Plan
  plan:
    name: Terraform Plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    if: github.event.inputs.destroy != 'yes'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Apply (only on push to prod/dev, not PRs)
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Post-provision: Configura LXC + Docker + Immich via Ansible
  provision:
    name: Provision Immich
    needs: apply
    runs-on: [self-hosted, prod]
    timeout-minutes: 20
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          if ! command -v ansible-playbook &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ansible
          fi
          ansible --version

      - name: Run immich-provision playbook
        env:
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          IMMICH_VERSION: "v3"
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          PROXMOX_IP="10.0.0.70"
          IMMICH_IP="${{ vars.IMMICH_HOST }}"
          RUNNER_KEY_SRC="/home/runner/.ssh/id_ed25519.pub"
          PROXMOX_KEY_DST="/tmp/runner_immich_ct.pub"

          # Atualiza known_hosts do runner para o CT
          mkdir -p /home/runner/.ssh
          ssh-keygen -f "/home/runner/.ssh/known_hosts" -R "${IMMICH_IP}" 2>/dev/null || true
          ssh-keyscan -H "${IMMICH_IP}" >> /home/runner/.ssh/known_hosts 2>/dev/null

          # Copia a chave pública para o Proxmox host (evita problemas de escape)
          scp -o StrictHostKeyChecking=no "${RUNNER_KEY_SRC}" "root@${PROXMOX_IP}:${PROXMOX_KEY_DST}"

          # Gera inventory dinâmico
          cat > /tmp/inventory-immich.yml << INVENTORY
          proxmox:
            hosts:
              naruto:
                ansible_host: ${PROXMOX_IP}
                ansible_user: root
          immich:
            hosts:
              immich_ct:
                ansible_host: ${IMMICH_IP}
                ansible_user: root
                ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          INVENTORY

          ansible-playbook \
            -i /tmp/inventory-immich.yml \
            ansible/playbooks/immich-provision.yml \
            -e immich_db_password="${{ secrets.IMMICH_DB_PASSWORD }}" \
            -e runner_key_file="${PROXMOX_KEY_DST}"
