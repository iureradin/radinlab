# ---
# Terraform Immich - Provision LXC Container
# Follows radinlab conventions: self-hosted runner, branches prod/dev
# ---

name: Terraform Immich

on:
  workflow_dispatch:
  push:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'
  pull_request:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "terraform/immich"

jobs:
  # --- Validate and Plan
  plan:
    name: Terraform Plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Apply (only on push to prod/dev, not PRs)
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Post-provision: Fix config + Setup Docker + Immich
  provision:
    name: Provision Immich
    needs: apply
    runs-on: [self-hosted, prod]
    timeout-minutes: 20
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Fix LXC config (bind mount + keyctl dedup)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.PROXMOX_HOST }} bash <<'SCRIPT'
          set -euo pipefail
          CT_ID=110

          # Para o container para modificar config
          pct stop ${CT_ID} 2>/dev/null || true
          sleep 5

          # Corrige keyctl duplicado (bug do Terraform provider)
          sed -i 's/keyctl=1,keyctl=1/keyctl=1/g' /etc/pve/lxc/${CT_ID}.conf

          # Garante keyctl habilitado (necessário para Docker em LXC unprivileged)
          if ! grep -q "keyctl=1" /etc/pve/lxc/${CT_ID}.conf; then
            sed -i 's/features: nesting=1/features: nesting=1,keyctl=1/' /etc/pve/lxc/${CT_ID}.conf
          fi

          # Garante gateway configurado (o módulo Terraform não passa gw)
          if ! grep -q "gw=" /etc/pve/lxc/${CT_ID}.conf; then
            sed -i 's/ip=10.0.0.76\/8/ip=10.0.0.76\/8,gw=10.0.0.1/' /etc/pve/lxc/${CT_ID}.conf
          fi

          # Adiciona bind mount das fotos (se não existir)
          if ! grep -q "^mp0:" /etc/pve/lxc/${CT_ID}.conf; then
            echo "mp0: /mnt/hd1tb/iure/fotos,mp=/mnt/fotos,ro=1" >> /etc/pve/lxc/${CT_ID}.conf
          fi

          # Inicia o container
          pct start ${CT_ID}
          sleep 10
          echo "CT ${CT_ID} iniciado"
          pct config ${CT_ID}
          SCRIPT

      - name: Wait for container network
        run: |
          echo "Aguardando container responder na rede..."
          for i in $(seq 1 30); do
            if ping -c1 -W1 ${{ vars.IMMICH_HOST }} &>/dev/null; then
              echo "Container acessível em ${{ vars.IMMICH_HOST }}"
              break
            fi
            echo "Tentativa ${i}/30..."
            sleep 3
          done

      - name: Setup Docker on LXC
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.IMMICH_HOST }} 'bash -s' < scripts/setup-docker.sh

      - name: Deploy Immich
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.IMMICH_HOST }} \
            "DB_PASSWORD='${{ secrets.IMMICH_DB_PASSWORD }}' \
             IMMICH_VERSION='v3' \
             bash -s" < scripts/setup-immich.sh

      - name: Validate deployment
        run: |
          echo "Validando deploy..."
          sleep 15
          if curl -sf http://${{ vars.IMMICH_HOST }}:2283/api/server/ping; then
            echo "✓ Immich respondendo com sucesso"
          else
            echo "✗ Immich não responde — verifique os logs"
            ssh -o StrictHostKeyChecking=no root@${{ vars.IMMICH_HOST }} \
              "cd /opt/immich && docker compose logs --tail 30"
            exit 1
          fi
