# ---
# Terraform Immich - Provision LXC Container
# Follows radinlab conventions: self-hosted runner, branches prod/dev
# ---

name: Terraform Immich

on:
  workflow_dispatch:
  push:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'
  pull_request:
    branches:
      - prod
      - dev
    paths:
      - 'terraform/immich/**'
      - 'scripts/setup-docker.sh'
      - 'scripts/setup-immich.sh'

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "terraform/immich"

jobs:
  # --- Validate and Plan
  plan:
    name: Terraform Plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Apply (only on push to prod/dev, not PRs)
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v unzip &>/dev/null || ! command -v node &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip nodejs
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "root@pam!terraform-token=${{ secrets.PROXMOX_API_TOKEN }}"
          TF_VAR_root_password: ${{ secrets.LXC_ROOT_PASSWORD }}

  # --- Post-provision: Setup Docker + Immich
  provision:
    name: Provision Immich
    needs: apply
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Add bind mount and keyctl (requires root on host)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.PROXMOX_HOST }} bash <<'SCRIPT'
          # Stop container to modify config
          pct stop 110 2>/dev/null || true
          sleep 3

          # Add bind mount for photos (same pattern as Jellyfin)
          if ! grep -q "mp0:" /etc/pve/lxc/110.conf; then
            echo "mp0: /mnt/hd4tb/immich,mp=/mnt/photos" >> /etc/pve/lxc/110.conf
          fi

          # Add keyctl feature (needed for Docker)
          sed -i 's/features: nesting=1/features: nesting=1,keyctl=1/' /etc/pve/lxc/110.conf

          # Create host directory for photos
          mkdir -p /mnt/hd4tb/immich

          # Start container
          pct start 110
          sleep 10
          SCRIPT

      - name: Wait for container network
        run: |
          echo "Waiting for container to get network..."
          for i in $(seq 1 30); do
            if ping -c1 -W1 ${{ vars.IMMICH_HOST }} &>/dev/null; then
              echo "Container reachable at ${{ vars.IMMICH_HOST }}"
              break
            fi
            sleep 2
          done

      - name: Setup Docker on LXC
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.IMMICH_HOST }} 'bash -s' < scripts/setup-docker.sh

      - name: Deploy Immich
        env:
          DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          IMMICH_VERSION: "release"
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.IMMICH_HOST }} \
            "DB_PASSWORD='${DB_PASSWORD}' IMMICH_VERSION='${IMMICH_VERSION}' bash -s" < scripts/setup-immich.sh
