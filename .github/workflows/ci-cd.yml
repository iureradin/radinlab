name: CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - prod
      - dev

jobs:
  lint:
    name: Ansible Lint
    runs-on: [self-hosted, prod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: |
          export PATH="/usr/local/bin:$PATH"
          if ! command -v ansible-lint &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip
            pip3 install ansible-lint --break-system-packages --ignore-installed ansible-core
          fi

      - name: Run ansible-lint
        run: /usr/local/bin/ansible-lint ansible/playbooks/*.yml

  proxmox-postinstall:
    name: Proxmox Post-Install
    needs: lint
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    env:
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validar variáveis obrigatórias
        run: |
          missing=""
          [ -z "${{ vars.PROXMOX_HOST }}" ] && missing="$missing PROXMOX_HOST"
          [ -z "${{ vars.ACME_EMAIL }}" ] && missing="$missing ACME_EMAIL"
          [ -z "${{ secrets.AWS_ACCESS_KEY }}" ] && missing="$missing AWS_ACCESS_KEY"
          [ -z "${{ secrets.AWS_SECRET_KEY }}" ] && missing="$missing AWS_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Variáveis ausentes:$missing"
            exit 1
          fi

      - name: Post-install Proxmox
        run: ansible-playbook -i "${{ vars.PROXMOX_HOST }}," -u root ansible/playbooks/proxmox-postinstall.yml

  acme:
    name: Configurar ACME
    needs: proxmox-postinstall
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    env:
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar ACME + HTTPS 443
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          PROXMOX_HOST: ${{ vars.PROXMOX_HOST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: ansible-playbook -i "${{ vars.PROXMOX_HOST }}," -u root ansible/playbooks/proxmox-acme.yml

  proxmox-ui:
    name: Customizar Interface
    needs: proxmox-postinstall
    runs-on: [self-hosted, prod]
    timeout-minutes: 5
    environment: ${{ github.ref_name }}
    env:
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar customização visual
        env:
          ENV_COLOR: ${{ github.ref_name == 'prod' && '#c62828' || '#1565c0' }}
        run: ansible-playbook -i "${{ vars.PROXMOX_HOST }}," -u root ansible/playbooks/proxmox-ui.yml

  terraform-npm:
    name: Terraform - NPM Container
    needs: acme
    runs-on: [self-hosted, prod]
    timeout-minutes: 10
    environment: ${{ github.ref_name }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Terraform
        run: |
          if command -v terraform &>/dev/null; then
            echo "Terraform já instalado"
            terraform version
            exit 0
          fi
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq && sudo apt-get install -y -qq terraform

      - name: Terraform Init
        working-directory: terraform/npm
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/npm
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/npm
        run: terraform apply -auto-approve tfplan

      - name: Obter IP do container
        id: npm-ip
        working-directory: terraform/npm
        run: |
          CT_ID=$(terraform output -raw npm_container_id)
          echo "Aguardando CT obter IP..."
          for i in $(seq 1 30); do
            IP=$(ssh -o StrictHostKeyChecking=no root@${{ vars.PROXMOX_HOST }} "pct exec $CT_ID -- hostname -I 2>/dev/null" | awk '{print $1}')
            if [ -n "$IP" ]; then
              echo "npm_ip=$IP" >> $GITHUB_OUTPUT
              echo "Container IP: $IP"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timeout esperando IP do container"
          exit 1

    outputs:
      npm_ip: ${{ steps.npm-ip.outputs.npm_ip }}

  npm-install:
    name: Instalar NPM
    needs: terraform-npm
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    env:
      ANSIBLE_HOST_KEY_CHECKING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Aguardar SSH do container
        run: |
          for i in $(seq 1 12); do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no root@${{ needs.terraform-npm.outputs.npm_ip }} "hostname" && exit 0
            sleep 10
          done
          echo "::error::SSH timeout"
          exit 1

      - name: Instalar Nginx Proxy Manager
        run: ansible-playbook -i "${{ needs.terraform-npm.outputs.npm_ip }}," -u root ansible/playbooks/npm-install.yml
